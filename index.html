<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Bangaram!</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://db.onlinewebfonts.com/c/a0d76618b1a6d42a48bdebdd4c3d13af?family=Kairengu+W00+Bold" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body>
  <div id="splash">
    <span id="splash-label">You have a message</span>
    <button id="open-btn">✉️</button>
  </div>
  <div id="collage">
    <div class="photo-slot"><img src="media/picture_5.png" alt="Photo 5" /></div>
    <div class="photo-slot"><img src="media/picture_1.png" alt="Photo 1" /></div>
    <div class="photo-slot"><img src="media/picture_6.png" alt="Photo 6" /></div>
    <div class="photo-slot"><img src="media/picture_8.jpg" alt="Photo 8" /></div>
    <div class="photo-slot"><img src="media/picture_7.png" alt="Photo 7" /></div>
    <div class="photo-slot"><img src="media/picture_3.png" alt="Photo 3" /></div>
    <div class="photo-slot"><img src="media/picture_2.png" alt="Photo 2" /></div>
    <div class="photo-slot"><img src="media/picture_4.png" alt="Photo 4" /></div>
    <div class="photo-slot"><img src="media/picture_9.jpg" alt="Photo 9" /></div>
  </div>
  <div id="vignette"></div>
  <div id="message">
    <h1>Happy Birthday Bangaram! 🎉</h1>
    <p>❤️💙💜 I love uuu bangaram 💜💙❤️</p>
  </div>
  <canvas id="confetti-canvas"></canvas>
  <audio id="bg-music" loop>
    <source src="media/Daylight.mp3" type="audio/mpeg">
  </audio>
  <button id="music-btn" aria-label="Toggle music">♪</button>
</body>
</html>
